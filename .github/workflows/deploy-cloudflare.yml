# Publishes the same static game to Cloudflare Workers (snailrace) on every
# push to main, so the workers.dev copy never falls behind GitHub Pages.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with
# "Workers Scripts: Edit") and CLOUDFLARE_ACCOUNT_ID. Without them the job
# says so and stops, green, so a fork or a fresh clone is not left red.
# scripts/deploy-cloudflare.sh is the same build and upload run by hand.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://snailrace.sajeevanveeriah.workers.dev
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the Workers copy was not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      # The same gate a contributor runs: nothing reaches the night's screen
      # that fails to typecheck or breaks a unit test.
      - name: Typecheck and unit tests
        if: steps.creds.outputs.ok == 'true'
        run: npm run typecheck && npm test

      - name: Build and deploy
        if: steps.creds.outputs.ok == 'true'
        run: bash scripts/deploy-cloudflare.sh

      - name: Verify the Worker serves this commit
        if: steps.creds.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            live="$(curl -fsS "$SITE_URL/deploy-sha.txt" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live at $SITE_URL: $live"; exit 0; fi
            echo "Waiting for $SITE_URL (serving ${live:-nothing})"; sleep 15
          done
          echo "::error::$SITE_URL is not serving $GITHUB_SHA"; exit 1
