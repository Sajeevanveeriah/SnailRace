# Deploys a static export of the game to GitHub Pages on every push to main.
#
# Pages is static hosting: the races, fun bets, cash console and reports all
# run there, and the stage shows "Cash only" because the Stripe API routes
# cannot. For card donations, deploy the same repo to a Node host (e.g.
# Vercel) with STRIPE_SECRET_KEY set - no code changes needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static export cannot carry server route handlers. The client never
      # imports from app/api, so the game builds and runs without them.
      - name: Strip server-only API routes
        run: rm -rf app/api

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
